name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npm run tsc

      - name: Markdown lint (master-index)
        run: npm run lint:md

      - name: Secret grep
        run: npm run secret-grep

      - name: Security audit
        run: npm run audit:security

      - name: Validate curriculum
        run: npm run validate

      - name: Completion audit
        run: npm run audit:completion

      - name: Unit tests
        run: npm test

      - name: Next build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
